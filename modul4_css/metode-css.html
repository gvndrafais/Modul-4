<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Inline dan Embedded CSS</title>
  <style>
    body { background-color: lightgrey; font-family: Arial, sans-serif; padding: 20px; }
    h2 { color: blue; }
    p { color: green; }
  </style>
</head>
<body>
  <h1 style="color:blue">This is a Blue Heading (Inline Style)</h1>
  <h2>Judul (Embedded Style)</h2>
  <p>Paragraf dengan warna hijau dari embedded CSS.</p>
</body>
</html>
